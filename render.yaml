# Render Blueprint — one Web Service serves both the API and the built frontend.
# Deploy: push this repo to GitHub, then in Render "New > Blueprint" and point it here.
services:
  - type: web
    name: tokencalci
    runtime: node
    plan: free
    # --include=dev is required: vite/react are devDependencies (they are bundled
    # into dist at build time and not needed at runtime), and Render's Node runtime
    # defaults NODE_ENV=production, which would otherwise skip them and fail the build.
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
