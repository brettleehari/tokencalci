<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 470" width="1320" height="470"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
     role="img" aria-labelledby="f1title f1desc">
  <title id="f1title">The Serving Chain</title>
  <desc id="f1desc">A weight checkpoint enters at the left. Nine further layers — precision, KV cache,
  batching, execution, parallelism, fleet, reliability, utilisation and surface — stand between it and a
  billable token. Only the first arrives in the download. Cost concentrates in fleet and utilisation.</desc>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#86868b"/>
    </marker>
    <linearGradient id="openg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8f1fd"/><stop offset="1" stop-color="#d6e6fb"/>
    </linearGradient>
    <linearGradient id="costg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f5f5f7"/><stop offset="1" stop-color="#ffe9d6"/>
    </linearGradient>
  </defs>

  <rect width="1320" height="470" fill="#ffffff"/>

  <!-- ── group headers ─────────────────────────────────────────────── -->
  <text x="20"  y="26" font-size="12" font-weight="700" letter-spacing="1.4" fill="#0071e3">IN THE DOWNLOAD</text>
  <text x="210" y="26" font-size="12" font-weight="700" letter-spacing="1.4" fill="#6e6e73">MODEL EXECUTION</text>
  <text x="750" y="26" font-size="12" font-weight="700" letter-spacing="1.4" fill="#6e6e73">PLATFORM &amp; ECONOMICS</text>
  <text x="1200" y="26" font-size="12" font-weight="700" letter-spacing="1.4" fill="#1d1d1f">OUTPUT</text>
  <line x1="20" y1="36" x2="180" y2="36" stroke="#0071e3" stroke-width="2"/>
  <line x1="210" y1="36" x2="710" y2="36" stroke="#d2d2d7" stroke-width="2"/>
  <line x1="750" y1="36" x2="1174" y2="36" stroke="#d2d2d7" stroke-width="2"/>
  <line x1="1200" y1="36" x2="1300" y2="36" stroke="#1d1d1f" stroke-width="2"/>

  <!-- ── layer 1: weights (the open one) ───────────────────────────── -->
  <rect x="20" y="80" width="160" height="120" rx="14" fill="url(#openg)" stroke="#0071e3" stroke-width="2"/>
  <text x="100" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="#0071e3">1 · WEIGHTS</text>
  <g stroke="#0071e3" stroke-width="1.6" fill="none" opacity=".85">
    <rect x="82" y="126" width="36" height="44" rx="4"/>
    <line x1="90" y1="138" x2="110" y2="138"/><line x1="90" y1="148" x2="110" y2="148"/>
    <line x1="90" y1="158" x2="103" y2="158"/>
  </g>
  <text x="100" y="188" text-anchor="middle" font-size="11.5" fill="#0071e3" font-weight="600">a file you download</text>
  <path d="M182 140 L206 140" stroke="#86868b" stroke-width="2" marker-end="url(#ar)"/>

  <!-- ── layers 2–10 ───────────────────────────────────────────────── -->
  <g font-size="11.5" fill="#1d1d1f">
    <!-- x = 210 + i*108 ; w = 100 -->
    <rect x="210" y="80" width="100" height="120" rx="12" fill="#f5f5f7" stroke="#d2d2d7"/>
    <text x="260" y="104" text-anchor="middle" font-size="10.5" fill="#86868b" font-weight="700">2</text>
    <text x="260" y="126" text-anchor="middle" font-weight="650">Precision</text>
    <text x="260" y="150" text-anchor="middle" font-size="10" fill="#6e6e73">quantise,</text>
    <text x="260" y="163" text-anchor="middle" font-size="10" fill="#6e6e73">calibrate</text>
    <text x="260" y="185" text-anchor="middle" font-size="10" fill="#0071e3" font-weight="650">sets fleet size</text>

    <rect x="318" y="80" width="100" height="120" rx="12" fill="#f5f5f7" stroke="#d2d2d7"/>
    <text x="368" y="104" text-anchor="middle" font-size="10.5" fill="#86868b" font-weight="700">3</text>
    <text x="368" y="126" text-anchor="middle" font-weight="650">KV cache</text>
    <text x="368" y="150" text-anchor="middle" font-size="10" fill="#6e6e73">paging, reuse,</text>
    <text x="368" y="163" text-anchor="middle" font-size="10" fill="#6e6e73">eviction</text>
    <text x="368" y="185" text-anchor="middle" font-size="10" fill="#0071e3" font-weight="650">sets concurrency</text>

    <rect x="426" y="80" width="100" height="120" rx="12" fill="#f5f5f7" stroke="#d2d2d7"/>
    <text x="476" y="104" text-anchor="middle" font-size="10.5" fill="#86868b" font-weight="700">4</text>
    <text x="476" y="126" text-anchor="middle" font-weight="650">Batching</text>
    <text x="476" y="150" text-anchor="middle" font-size="10" fill="#6e6e73">continuous,</text>
    <text x="476" y="163" text-anchor="middle" font-size="10" fill="#6e6e73">chunked prefill</text>
    <text x="476" y="185" text-anchor="middle" font-size="10" fill="#0071e3" font-weight="650">~100× on cost</text>

    <rect x="534" y="80" width="100" height="120" rx="12" fill="#f5f5f7" stroke="#d2d2d7"/>
    <text x="584" y="104" text-anchor="middle" font-size="10.5" fill="#86868b" font-weight="700">5</text>
    <text x="584" y="126" text-anchor="middle" font-weight="650">Execution</text>
    <text x="584" y="150" text-anchor="middle" font-size="10" fill="#6e6e73">kernels, graphs,</text>
    <text x="584" y="163" text-anchor="middle" font-size="10" fill="#6e6e73">speculative</text>
    <text x="584" y="185" text-anchor="middle" font-size="10" fill="#0071e3" font-weight="650">~2× per release</text>

    <rect x="642" y="80" width="100" height="120" rx="12" fill="#f5f5f7" stroke="#d2d2d7"/>
    <text x="692" y="104" text-anchor="middle" font-size="10.5" fill="#86868b" font-weight="700">6</text>
    <text x="692" y="126" text-anchor="middle" font-weight="650">Parallelism</text>
    <text x="692" y="150" text-anchor="middle" font-size="10" fill="#6e6e73">TP / PP / EP</text>
    <text x="692" y="163" text-anchor="middle" font-size="10" fill="#6e6e73">+ collectives</text>
    <text x="692" y="185" text-anchor="middle" font-size="10" fill="#0071e3" font-weight="650">makes it fit</text>

    <rect x="750" y="80" width="100" height="120" rx="12" fill="#fff4ea" stroke="#ff9f0a" stroke-width="1.6"/>
    <text x="800" y="104" text-anchor="middle" font-size="10.5" fill="#c67700" font-weight="700">7</text>
    <text x="800" y="126" text-anchor="middle" font-weight="650">Fleet</text>
    <text x="800" y="150" text-anchor="middle" font-size="10" fill="#6e6e73">replicas,</text>
    <text x="800" y="163" text-anchor="middle" font-size="10" fill="#6e6e73">autoscaling</text>
    <text x="800" y="185" text-anchor="middle" font-size="10" fill="#c67700" font-weight="650">idle is yours</text>

    <rect x="858" y="80" width="100" height="120" rx="12" fill="#f5f5f7" stroke="#d2d2d7"/>
    <text x="908" y="104" text-anchor="middle" font-size="10.5" fill="#86868b" font-weight="700">8</text>
    <text x="908" y="126" text-anchor="middle" font-weight="650">Reliability</text>
    <text x="908" y="150" text-anchor="middle" font-size="10" fill="#6e6e73">drain, failover,</text>
    <text x="908" y="163" text-anchor="middle" font-size="10" fill="#6e6e73">rolling upgrade</text>
    <text x="908" y="185" text-anchor="middle" font-size="10" fill="#0071e3" font-weight="650">27–100% uptime</text>

    <rect x="966" y="80" width="100" height="120" rx="12" fill="#fff4ea" stroke="#ff9f0a" stroke-width="2.4"/>
    <text x="1016" y="104" text-anchor="middle" font-size="10.5" fill="#c67700" font-weight="700">9</text>
    <text x="1016" y="126" text-anchor="middle" font-weight="650">Utilisation</text>
    <text x="1016" y="150" text-anchor="middle" font-size="10" fill="#6e6e73">pooled, uncor-</text>
    <text x="1016" y="163" text-anchor="middle" font-size="10" fill="#6e6e73">related demand</text>
    <text x="1016" y="185" text-anchor="middle" font-size="10" fill="#c67700" font-weight="700">not replicable</text>

    <rect x="1074" y="80" width="100" height="120" rx="12" fill="#f5f5f7" stroke="#d2d2d7"/>
    <text x="1124" y="104" text-anchor="middle" font-size="10.5" fill="#86868b" font-weight="700">10</text>
    <text x="1124" y="126" text-anchor="middle" font-weight="650">Surface</text>
    <text x="1124" y="150" text-anchor="middle" font-size="10" fill="#6e6e73">API, streaming,</text>
    <text x="1124" y="163" text-anchor="middle" font-size="10" fill="#6e6e73">quotas, metering</text>
    <text x="1124" y="185" text-anchor="middle" font-size="10" fill="#0071e3" font-weight="650">a quarter of work</text>
  </g>

  <path d="M1176 140 L1198 140" stroke="#86868b" stroke-width="2" marker-end="url(#ar)"/>

  <!-- ── output ────────────────────────────────────────────────────── -->
  <rect x="1200" y="80" width="100" height="120" rx="14" fill="#1d1d1f"/>
  <text x="1250" y="128" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">BILLABLE</text>
  <text x="1250" y="146" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">TOKEN</text>
  <text x="1250" y="172" text-anchor="middle" font-size="10.5" fill="#a1a1a6">priced per 1M</text>

  <!-- ── acquirability band ────────────────────────────────────────── -->
  <line x1="210" y1="222" x2="958" y2="222" stroke="#d2d2d7" stroke-width="1.5"/>
  <line x1="210" y1="222" x2="210" y2="214" stroke="#d2d2d7" stroke-width="1.5"/>
  <line x1="958" y1="222" x2="958" y2="214" stroke="#d2d2d7" stroke-width="1.5"/>
  <text x="584" y="242" text-anchor="middle" font-size="11.5" fill="#6e6e73">
    <tspan font-weight="700" fill="#1d1d1f">Engineering.</tspan> Can be hired, bought, or adopted from open source.
  </text>
  <line x1="966" y1="222" x2="1174" y2="222" stroke="#ff9f0a" stroke-width="1.5"/>
  <line x1="966" y1="222" x2="966" y2="214" stroke="#ff9f0a" stroke-width="1.5"/>
  <line x1="1174" y1="222" x2="1174" y2="214" stroke="#ff9f0a" stroke-width="1.5"/>
  <text x="1070" y="242" text-anchor="middle" font-size="11.5" fill="#c67700" font-weight="650">Structural.</text>
  <text x="1070" y="257" text-anchor="middle" font-size="10.5" fill="#6e6e73">A property of your tenants,</text>
  <text x="1070" y="270" text-anchor="middle" font-size="10.5" fill="#6e6e73">not your competence.</text>

  <!-- ── the finding ───────────────────────────────────────────────── -->
  <rect x="20" y="300" width="1280" height="150" rx="14" fill="url(#costg)" stroke="#d2d2d7"/>
  <text x="44" y="330" font-size="12" font-weight="700" letter-spacing="1.3" fill="#6e6e73">WHERE THE COST ACTUALLY IS</text>

  <text x="44" y="364" font-size="13" fill="#1d1d1f">Bare compute — the silicon alone, at full utilisation</text>
  <rect x="470" y="352" width="46" height="16" rx="4" fill="#34c759" opacity=".22"/>
  <rect x="470" y="352" width="46" height="16" rx="4" fill="none" stroke="#34c759"/>
  <text x="530" y="365" font-size="13" font-weight="700" fill="#1d1d1f">0.07× – 0.50×</text>
  <text x="666" y="365" font-size="12" fill="#6e6e73">cheaper than renting, for every model tested</text>

  <text x="44" y="398" font-size="13" fill="#1d1d1f">Fully loaded — the same fleet, with layers 7 and 9 put back</text>
  <rect x="470" y="386" width="150" height="16" rx="4" fill="#ff9f0a" opacity=".26"/>
  <rect x="470" y="386" width="150" height="16" rx="4" fill="none" stroke="#ff9f0a"/>
  <text x="634" y="399" font-size="13" font-weight="700" fill="#1d1d1f">1.1× – 3.1×</text>
  <text x="726" y="399" font-size="12" fill="#6e6e73">the premium is idle capacity and people, not hardware</text>

  <line x1="44" y1="416" x2="1276" y2="416" stroke="#d2d2d7"/>
  <text x="44" y="437" font-size="12" fill="#6e6e73">
    <tspan font-weight="700" fill="#1d1d1f">And no single break-even.</tspan>
    <tspan> Same model, same hardware, same token volume — workload shape alone moves the answer</tspan>
    <tspan font-weight="700" fill="#1d1d1f"> 1.5× to 3.8×</tspan><tspan>, further than model choice does.</tspan>
  </text>
</svg>
