<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 470" width="1120" height="470"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
     role="img" aria-labelledby="f2t f2d">
  <title id="f2t">Cost is piecewise constant in resident context</title>
  <desc id="f2d">Self-host cost per million tokens plotted against resident context. The curve is a
  staircase: flat runs where additional context is free, separated by vertical risers where the fleet
  gains a GPU per replica. Two operating points are marked — one mid-step where the elasticity of
  context is zero, one near a riser where it exceeds two.</desc>
  <rect width="1120" height="470" fill="#ffffff"/>

  <text x="92" y="34" font-size="15" font-weight="700" fill="#1d1d1f">Cost is piecewise constant in resident context</text>
  <text x="92" y="54" font-size="12.5" fill="#6e6e73">Llama 3.3 70B at fp8 · 200,000 requests/day · concurrency held at 97 · same model, same hardware throughout</text>

  <!-- grid -->
  <line x1="92" y1="348.0" x2="1064" y2="348.0" stroke="#ededf0"/>
  <text x="82" y="352.0" text-anchor="end" font-size="11" fill="#86868b">$0.00</text>
  <line x1="92" y1="326.1" x2="1064" y2="326.1" stroke="#ededf0"/>
  <text x="82" y="330.1" text-anchor="end" font-size="11" fill="#86868b">$0.10</text>
  <line x1="92" y1="304.2" x2="1064" y2="304.2" stroke="#ededf0"/>
  <text x="82" y="308.2" text-anchor="end" font-size="11" fill="#86868b">$0.20</text>
  <line x1="92" y1="282.3" x2="1064" y2="282.3" stroke="#ededf0"/>
  <text x="82" y="286.3" text-anchor="end" font-size="11" fill="#86868b">$0.30</text>
  <line x1="92" y1="260.4" x2="1064" y2="260.4" stroke="#ededf0"/>
  <text x="82" y="264.4" text-anchor="end" font-size="11" fill="#86868b">$0.40</text>
  <line x1="92" y1="238.5" x2="1064" y2="238.5" stroke="#ededf0"/>
  <text x="82" y="242.5" text-anchor="end" font-size="11" fill="#86868b">$0.50</text>
  <line x1="92" y1="216.6" x2="1064" y2="216.6" stroke="#ededf0"/>
  <text x="82" y="220.6" text-anchor="end" font-size="11" fill="#86868b">$0.60</text>
  <line x1="92" y1="194.7" x2="1064" y2="194.7" stroke="#ededf0"/>
  <text x="82" y="198.7" text-anchor="end" font-size="11" fill="#86868b">$0.70</text>
  <line x1="92" y1="172.8" x2="1064" y2="172.8" stroke="#ededf0"/>
  <text x="82" y="176.8" text-anchor="end" font-size="11" fill="#86868b">$0.80</text>
  <line x1="92" y1="150.9" x2="1064" y2="150.9" stroke="#ededf0"/>
  <text x="82" y="154.9" text-anchor="end" font-size="11" fill="#86868b">$0.90</text>
  <line x1="92" y1="129.1" x2="1064" y2="129.1" stroke="#ededf0"/>
  <text x="82" y="133.1" text-anchor="end" font-size="11" fill="#86868b">$1.00</text>
  <line x1="92" y1="107.2" x2="1064" y2="107.2" stroke="#ededf0"/>
  <text x="82" y="111.2" text-anchor="end" font-size="11" fill="#86868b">$1.10</text>
  <line x1="92" y1="85.3" x2="1064" y2="85.3" stroke="#ededf0"/>
  <text x="82" y="89.3" text-anchor="end" font-size="11" fill="#86868b">$1.20</text>
  <line x1="92" y1="348" x2="1064" y2="348" stroke="#d2d2d7"/>
  <line x1="92" y1="74" x2="92" y2="348" stroke="#d2d2d7"/>
  <text x="299.0" y="368" text-anchor="middle" font-size="11" fill="#86868b">5K</text>
  <text x="524.0" y="368" text-anchor="middle" font-size="11" fill="#86868b">10K</text>
  <text x="749.0" y="368" text-anchor="middle" font-size="11" fill="#86868b">15K</text>
  <text x="974.0" y="368" text-anchor="middle" font-size="11" fill="#86868b">20K</text>
  <text x="578" y="390" text-anchor="middle" font-size="12" fill="#6e6e73">resident context per active request (tokens)</text>
  <text x="26" y="211" font-size="12" fill="#6e6e73" transform="rotate(-90 26 211)" text-anchor="middle">self-host $ per 1M tokens</text>

  <!-- risers, drawn behind the curve -->
  <line x1="182.0" y1="257.0" x2="182.0" y2="236.6" stroke="#ff9f0a" stroke-width="2.5"/>
  <line x1="296.8" y1="236.6" x2="296.8" y2="216.3" stroke="#ff9f0a" stroke-width="2.5"/>
  <line x1="409.3" y1="216.3" x2="409.3" y2="196.0" stroke="#ff9f0a" stroke-width="2.5"/>
  <line x1="521.8" y1="196.0" x2="521.8" y2="175.6" stroke="#ff9f0a" stroke-width="2.5"/>
  <line x1="636.5" y1="175.6" x2="636.5" y2="155.3" stroke="#ff9f0a" stroke-width="2.5"/>
  <line x1="749.0" y1="155.3" x2="749.0" y2="135.0" stroke="#ff9f0a" stroke-width="2.5"/>
  <line x1="861.5" y1="135.0" x2="861.5" y2="114.6" stroke="#ff9f0a" stroke-width="2.5"/>
  <line x1="976.3" y1="114.6" x2="976.3" y2="94.3" stroke="#ff9f0a" stroke-width="2.5"/>

  <!-- the staircase -->
  <path d="M92.0 257.0 L179.8 257.0 L182.0 236.6 L294.5 236.6 L296.8 216.3 L407.0 216.3 L409.3 196.0 L519.5 196.0 L521.8 175.6 L634.3 175.6 L636.5 155.3 L746.8 155.3 L749.0 135.0 L859.3 135.0 L861.5 114.6 L974.0 114.6 L976.3 94.3 L1064.0 94.3" fill="none" stroke="#0071e3" stroke-width="2.8" stroke-linejoin="round"/>

  <!-- GPU count per run -->
  <text x="135.9" y="246.0" text-anchor="middle" font-size="10.5" fill="#0071e3" font-weight="650">2 GPU</text>
  <text x="238.3" y="225.6" text-anchor="middle" font-size="10.5" fill="#0071e3" font-weight="650">3 GPU</text>
  <text x="351.9" y="205.3" text-anchor="middle" font-size="10.5" fill="#0071e3" font-weight="650">4 GPU</text>
  <text x="464.4" y="185.0" text-anchor="middle" font-size="10.5" fill="#0071e3" font-weight="650">5 GPU</text>
  <text x="578.0" y="164.6" text-anchor="middle" font-size="10.5" fill="#0071e3" font-weight="650">6 GPU</text>
  <text x="691.6" y="144.3" text-anchor="middle" font-size="10.5" fill="#0071e3" font-weight="650">7 GPU</text>
  <text x="804.1" y="124.0" text-anchor="middle" font-size="10.5" fill="#0071e3" font-weight="650">8 GPU</text>
  <text x="917.8" y="103.6" text-anchor="middle" font-size="10.5" fill="#0071e3" font-weight="650">9 GPU</text>
  <text x="1020.1" y="83.3" text-anchor="middle" font-size="10.5" fill="#0071e3" font-weight="650">10 GPU</text>

  <!-- "free" annotation on the widest run -->
  <text x="238.3" y="258.6" text-anchor="middle" font-size="11" fill="#34c759" font-weight="650">context is free along here</text>
  <text x="238.3" y="273.6" text-anchor="middle" font-size="10.5" fill="#6e6e73">elasticity 0.00 — the marginal token costs nothing</text>

  <!-- riser callout -->
  <text x="194.0" y="90.0" font-size="11" fill="#c67700" font-weight="650">each riser = +1 GPU per replica</text>
  <text x="194.0" y="105.0" font-size="10.5" fill="#6e6e73">the marginal token costs a whole card</text>

  <!-- operating points -->
  <circle cx="186.5" cy="236.6" r="6" fill="#34c759" stroke="#fff" stroke-width="2"/>
  <circle cx="276.5" cy="236.6" r="6" fill="#ff9f0a" stroke="#fff" stroke-width="2"/>

  <!-- the comparison panel: the finding -->
  <rect x="92" y="382" width="972" height="72" rx="10" fill="#f5f5f7" stroke="#d2d2d7"/>
  <circle cx="116" cy="404" r="5" fill="#34c759"/>
  <text x="130" y="408" font-size="12.5" fill="#1d1d1f"><tspan font-weight="700">Mid-step, 2,500 tokens.</tspan> 11% of the step consumed. Elasticity of context <tspan font-weight="700" fill="#34c759">0.00</tspan> · of volume <tspan font-weight="700" fill="#34c759">-1.00</tspan> (growth dilutes fixed cost)</text>
  <circle cx="116" cy="432" r="5" fill="#ff9f0a"/>
  <text x="130" y="436" font-size="12.5" fill="#1d1d1f"><tspan font-weight="700">Near the riser, 4,500 tokens.</tspan> 96% consumed. Elasticity of context <tspan font-weight="700" fill="#c67700">1.76</tspan> · of volume <tspan font-weight="700" fill="#c67700">+0.76</tspan> — growth now buys hardware</text>
</svg>
