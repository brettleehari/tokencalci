<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 378" width="860" height="378"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="vdt vdd">
  <title id="vdt">Where a replica's memory goes</title>
  <desc id="vdd">Stacked bars of replica VRAM split into weights, KV cache and other allowances, for five models. Qwen3 30B-A3B: weights 30, KV 26, other 5, total 60 GB; gpt-oss-120b: weights 59, KV 19, other 12, total 89 GB; Llama 3.3 70B: weights 70, KV 86, other 14, total 170 GB; Gemma 4 31B: weights 16, KV 69, other 3, total 87 GB; DeepSeek V3.2: weights 671, KV 18, other 133, total 823 GB.</desc>
  <rect width="860" height="378" fill="#ffffff"/>
  <text x="24" y="34" font-size="16" font-weight="700" fill="#1d1d1f">Where a replica's memory goes</text>
  <text x="24" y="56" font-size="13" fill="#6e6e73">Share of replica VRAM by component. KV cache is set by attention architecture, not by parameter count.</text>
  <rect x="170" y="78" width="13" height="13" rx="3" fill="#0071e3"/><text x="189" y="89" font-size="12.5" fill="#1d1d1f">Weights</text>
  <rect x="257" y="78" width="13" height="13" rx="3" fill="#eb6834"/><text x="276" y="89" font-size="12.5" fill="#1d1d1f">KV cache</text>
  <rect x="351" y="78" width="13" height="13" rx="3" fill="#a1a1a6"/><text x="370" y="89" font-size="12.5" fill="#1d1d1f">Workspace, buffers, fragmentation (assumed)</text>
  <text x="156" y="135" text-anchor="end" font-size="13" font-weight="650" fill="#1d1d1f">Qwen3 30B-A3B</text>
  <rect x="170.0" y="118" width="273.4" height="24" fill="#0071e3"/>
  <text x="306.7" y="134.5" text-anchor="middle" font-size="12" font-weight="650" fill="#fff">30 GB</text>
  <rect x="445.4" y="118" width="236.7" height="24" fill="#eb6834"/>
  <text x="563.8" y="134.5" text-anchor="middle" font-size="12" font-weight="650" fill="#fff">26 GB</text>
  <path d="M684.1 118 H726.0 Q730.0 118 730.0 122 V138 Q730.0 142 726.0 142 H684.1 Z" fill="#a1a1a6"/>
  <text x="707.0" y="134.5" text-anchor="middle" font-size="12" font-weight="650" fill="#1d1d1f">5 GB</text>
  <text x="742" y="135" font-size="12.5" fill="#1d1d1f"><tspan font-weight="700">60 GB</tspan><tspan fill="#6e6e73"> · KV 43%</tspan></text>
  <text x="156" y="177" text-anchor="end" font-size="13" font-weight="650" fill="#1d1d1f">gpt-oss-120b</text>
  <rect x="170.0" y="160" width="365.1" height="24" fill="#0071e3"/>
  <text x="352.6" y="176.5" text-anchor="middle" font-size="12" font-weight="650" fill="#fff">59 GB</text>
  <rect x="537.1" y="160" width="116.2" height="24" fill="#eb6834"/>
  <text x="595.2" y="176.5" text-anchor="middle" font-size="12" font-weight="650" fill="#fff">19 GB</text>
  <path d="M655.3 160 H726.0 Q730.0 160 730.0 164 V180 Q730.0 184 726.0 184 H655.3 Z" fill="#a1a1a6"/>
  <text x="692.7" y="176.5" text-anchor="middle" font-size="12" font-weight="650" fill="#1d1d1f">12 GB</text>
  <text x="742" y="177" font-size="12.5" fill="#1d1d1f"><tspan font-weight="700">89 GB</tspan><tspan fill="#6e6e73"> · KV 21%</tspan></text>
  <text x="156" y="219" text-anchor="end" font-size="13" font-weight="650" fill="#1d1d1f">Llama 3.3 70B</text>
  <rect x="170.0" y="202" width="228.6" height="24" fill="#0071e3"/>
  <text x="284.3" y="218.5" text-anchor="middle" font-size="12" font-weight="650" fill="#fff">70 GB</text>
  <rect x="400.6" y="202" width="281.3" height="24" fill="#eb6834"/>
  <text x="541.2" y="218.5" text-anchor="middle" font-size="12" font-weight="650" fill="#fff">86 GB</text>
  <path d="M683.9 202 H726.0 Q730.0 202 730.0 206 V222 Q730.0 226 726.0 226 H683.9 Z" fill="#a1a1a6"/>
  <text x="706.9" y="218.5" text-anchor="middle" font-size="12" font-weight="650" fill="#1d1d1f">14 GB</text>
  <text x="742" y="219" font-size="12.5" fill="#1d1d1f"><tspan font-weight="700">170 GB</tspan><tspan fill="#6e6e73"> · KV 51%</tspan></text>
  <text x="156" y="261" text-anchor="end" font-size="13" font-weight="650" fill="#1d1d1f">Gemma 4 31B</text>
  <rect x="170.0" y="244" width="99.8" height="24" fill="#0071e3"/>
  <text x="219.9" y="260.5" text-anchor="middle" font-size="12" font-weight="650" fill="#fff">16 GB</text>
  <rect x="271.8" y="244" width="437.1" height="24" fill="#eb6834"/>
  <text x="490.4" y="260.5" text-anchor="middle" font-size="12" font-weight="650" fill="#fff">69 GB</text>
  <path d="M710.9 244 H726.0 Q730.0 244 730.0 248 V264 Q730.0 268 726.0 268 H710.9 Z" fill="#a1a1a6"/>
  <text x="742" y="261" font-size="12.5" fill="#1d1d1f"><tspan font-weight="700">87 GB</tspan><tspan fill="#6e6e73"> · KV 79%</tspan></text>
  <text x="156" y="303" text-anchor="end" font-size="13" font-weight="650" fill="#1d1d1f">DeepSeek V3.2</text>
  <rect x="170.0" y="286" width="455.1" height="24" fill="#0071e3"/>
  <text x="397.6" y="302.5" text-anchor="middle" font-size="12" font-weight="650" fill="#fff">671 GB</text>
  <rect x="627.1" y="286" width="10.3" height="24" fill="#eb6834"/>
  <path d="M639.4 286 H726.0 Q730.0 286 730.0 290 V306 Q730.0 310 726.0 310 H639.4 Z" fill="#a1a1a6"/>
  <text x="684.7" y="302.5" text-anchor="middle" font-size="12" font-weight="650" fill="#1d1d1f">133 GB</text>
  <text x="742" y="303" font-size="12.5" fill="#1d1d1f"><tspan font-weight="700">823 GB</tspan><tspan fill="#6e6e73"> · KV 2%</tspan></text>
  <text x="170" y="342" font-size="12" fill="#86868b">Each bar is one replica's memory, scaled to 100%. At 1,024-token context and 256 concurrent requests.</text>
  <text x="170" y="360" font-size="12" fill="#86868b">A flat allowance on top of weights cannot represent this: KV is 2% of one footprint and 79% of another.</text>
</svg>
