<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 540" width="860" height="540"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="rct rcd">
  <title id="rct">The refresh cycle</title>
  <desc id="rcd">Eight stages arranged clockwise in a ring: watch, qualify, re-derive, re-benchmark, re-size, shadow, cut over, retire. A ninth, roll back, sits in the centre connected to cut over by a dashed line.</desc>
  <rect width="860" height="540" fill="#ffffff"/>
  <text x="24" y="34" font-size="16" font-weight="700" fill="#1d1d1f">A cycle rather than a chain</text>
  <text x="24" y="56" font-size="13" fill="#6e6e73">What an organisation repeats each time it adopts a new open model on hardware that is already serving traffic</text>
  <ellipse cx="270" cy="296" rx="190" ry="200" fill="none" stroke="#d2d2d7" stroke-width="2"/>
  <path d="M-7 -6 L6 0 L-7 6 Z" fill="#86868b" transform="translate(342.7 111.2) rotate(23.6)"/>
  <path d="M-7 -6 L6 0 L-7 6 Z" fill="#86868b" transform="translate(445.5 219.5) rotate(68.5)"/>
  <path d="M-7 -6 L6 0 L-7 6 Z" fill="#86868b" transform="translate(445.5 372.5) rotate(111.5)"/>
  <path d="M-7 -6 L6 0 L-7 6 Z" fill="#86868b" transform="translate(342.7 480.8) rotate(156.4)"/>
  <path d="M-7 -6 L6 0 L-7 6 Z" fill="#86868b" transform="translate(197.3 480.8) rotate(-156.4)"/>
  <path d="M-7 -6 L6 0 L-7 6 Z" fill="#86868b" transform="translate(94.5 372.5) rotate(-111.5)"/>
  <path d="M-7 -6 L6 0 L-7 6 Z" fill="#86868b" transform="translate(94.5 219.5) rotate(-68.5)"/>
  <path d="M-7 -6 L6 0 L-7 6 Z" fill="#86868b" transform="translate(197.3 111.2) rotate(-23.6)"/>
  <line x1="130.0" y1="304.0" x2="180" y2="296" stroke="#eb6834" stroke-width="2" stroke-dasharray="6 5"/>
  <rect x="180" y="268" width="180" height="56" rx="10" fill="#fdece4" stroke="#eb6834" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="270" y="291" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1d1d1f">9 · Roll back</text>
  <text x="270" y="309" text-anchor="middle" font-size="11.5" fill="#6e6e73">required, and hoped unused</text>
  <rect x="206.0" y="76.0" width="128" height="40" rx="10" fill="#ffffff" stroke="#1d1d1f" stroke-width="1.6"/>
  <text x="270.0" y="101.0" text-anchor="middle" font-size="13" font-weight="650" fill="#1d1d1f">1 · Watch</text>
  <rect x="340.4" y="134.6" width="128" height="40" rx="10" fill="#ffffff" stroke="#1d1d1f" stroke-width="1.6"/>
  <text x="404.4" y="159.6" text-anchor="middle" font-size="13" font-weight="650" fill="#1d1d1f">2 · Qualify</text>
  <rect x="396.0" y="276.0" width="128" height="40" rx="10" fill="#ffffff" stroke="#1d1d1f" stroke-width="1.6"/>
  <text x="460.0" y="301.0" text-anchor="middle" font-size="13" font-weight="650" fill="#1d1d1f">3 · Re-derive</text>
  <rect x="340.4" y="417.4" width="128" height="40" rx="10" fill="#ffffff" stroke="#1d1d1f" stroke-width="1.6"/>
  <text x="404.4" y="442.4" text-anchor="middle" font-size="13" font-weight="650" fill="#1d1d1f">4 · Re-benchmark</text>
  <rect x="206.0" y="476.0" width="128" height="40" rx="10" fill="#ffffff" stroke="#1d1d1f" stroke-width="1.6"/>
  <text x="270.0" y="501.0" text-anchor="middle" font-size="13" font-weight="650" fill="#1d1d1f">5 · Re-size</text>
  <rect x="71.6" y="417.4" width="128" height="40" rx="10" fill="#e6f0fc" stroke="#0071e3" stroke-width="1.6"/>
  <text x="135.6" y="442.4" text-anchor="middle" font-size="13" font-weight="650" fill="#1d1d1f">6 · Shadow</text>
  <rect x="16.0" y="276.0" width="128" height="40" rx="10" fill="#e6f0fc" stroke="#0071e3" stroke-width="1.6"/>
  <text x="80.0" y="301.0" text-anchor="middle" font-size="13" font-weight="650" fill="#1d1d1f">7 · Cut over</text>
  <rect x="71.6" y="134.6" width="128" height="40" rx="10" fill="#ffffff" stroke="#1d1d1f" stroke-width="1.6"/>
  <text x="135.6" y="159.6" text-anchor="middle" font-size="13" font-weight="650" fill="#1d1d1f">8 · Retire</text>
  <text x="556" y="130" font-size="13.5" font-weight="700" fill="#1d1d1f">Paid once per model, per refresh</text>
  <text x="556" y="150" font-size="12" fill="#6e6e73">The ten layers are not a one-time build. Every</text>
  <text x="556" y="167" font-size="12" fill="#6e6e73">new checkpoint sends the fleet round again.</text>
  <text x="556" y="226" font-size="13.5" font-weight="700" fill="#1d1d1f">Layers are re-derived, not reused</text>
  <text x="556" y="246" font-size="12" fill="#6e6e73">Precision, throughput, replica sizing and engine</text>
  <text x="556" y="263" font-size="12" fill="#6e6e73">versions are all invalidated by a new checkpoint.</text>
  <text x="556" y="322" font-size="13.5" font-weight="700" fill="#1d1d1f">The transition happens under load</text>
  <text x="556" y="342" font-size="12" fill="#6e6e73">Shadow and cut-over (blue) run on a fleet already</text>
  <text x="556" y="359" font-size="12" fill="#6e6e73">serving users, when VRAM is most contended.</text>
  <text x="556" y="418" font-size="13.5" font-weight="700" fill="#1d1d1f">Quality is not portable</text>
  <text x="556" y="438" font-size="12" fill="#6e6e73">Prompts, parsers and evaluations are tuned to one</text>
  <text x="556" y="455" font-size="12" fill="#6e6e73">model's behaviour and must be redone.</text>

</svg>
