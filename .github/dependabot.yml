# Free, built into GitHub. Keeps dependencies and Actions current without anyone
# remembering to look. Monthly rather than weekly: this project has five runtime
# dependencies, and a PR a week for a dev-dependency patch trains people to ignore them.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(ci)"
