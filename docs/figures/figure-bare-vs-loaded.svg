<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 424" width="860" height="424"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="blt bld">
  <title id="blt">The silicon is cheap; the gap is operational</title>
  <desc id="bld">For each of five models, bare compute cost and fully loaded cost as multiples of the API price. Bare compute is below 1.0 in every case; fully loaded is above it in every case. Qwen3 30B-A3B: 0.07 and 1.7; gpt-oss-120b: 0.08 and 1.7; Gemma 4 31B: 0.13 and 2.2; Llama 3.3 70B: 0.25 and 2.1; DeepSeek V3.2: 0.48 and 3.</desc>
  <rect width="860" height="424" fill="#ffffff"/>
  <text x="24" y="34" font-size="16" font-weight="700" fill="#1d1d1f">The silicon is cheap; the gap is operational</text>
  <text x="24" y="56" font-size="13" fill="#6e6e73">Self-host cost as a multiple of the neocloud API price (1.0× = parity). The distance between the dots is layers 7 and 9.</text>
  <line x1="200.0" y1="102" x2="200.0" y2="334" stroke="#ededf0"/>
  <text x="200.0" y="352" text-anchor="middle" font-size="11.5" fill="#86868b">0.0×</text>
  <line x1="300.0" y1="102" x2="300.0" y2="334" stroke="#ededf0"/>
  <text x="300.0" y="352" text-anchor="middle" font-size="11.5" fill="#86868b">0.5×</text>
  <line x1="400.0" y1="102" x2="400.0" y2="334" stroke="#ededf0"/>
  <text x="400.0" y="352" text-anchor="middle" font-size="11.5" fill="#86868b">1.0×</text>
  <line x1="500.0" y1="102" x2="500.0" y2="334" stroke="#ededf0"/>
  <text x="500.0" y="352" text-anchor="middle" font-size="11.5" fill="#86868b">1.5×</text>
  <line x1="600.0" y1="102" x2="600.0" y2="334" stroke="#ededf0"/>
  <text x="600.0" y="352" text-anchor="middle" font-size="11.5" fill="#86868b">2.0×</text>
  <line x1="700.0" y1="102" x2="700.0" y2="334" stroke="#ededf0"/>
  <text x="700.0" y="352" text-anchor="middle" font-size="11.5" fill="#86868b">2.5×</text>
  <line x1="800.0" y1="102" x2="800.0" y2="334" stroke="#ededf0"/>
  <text x="800.0" y="352" text-anchor="middle" font-size="11.5" fill="#86868b">3.0×</text>
  <line x1="400.0" y1="94" x2="400.0" y2="334" stroke="#1d1d1f" stroke-width="1.4" stroke-dasharray="4 4"/>
  <text x="392.0" y="90" text-anchor="end" font-size="12" fill="#6e6e73">← cheaper than renting</text>
  <text x="408.0" y="90" font-size="12" fill="#6e6e73">dearer than renting →</text>
  <text x="184" y="125" text-anchor="end" font-size="13.5" font-weight="650" fill="#1d1d1f">Qwen3 30B-A3B</text>
  <text x="184" y="141" text-anchor="end" font-size="11.5" fill="#86868b">served at fp8</text>
  <line x1="214.0" y1="124" x2="540.0" y2="124" stroke="#d2d2d7" stroke-width="4" stroke-linecap="round"/>
  <circle cx="214.0" cy="124" r="7" fill="#0071e3" stroke="#fff" stroke-width="2"/>
  <circle cx="540.0" cy="124" r="7" fill="#eb6834" stroke="#fff" stroke-width="2"/>
  <text x="214.0" y="147" text-anchor="middle" font-size="12" font-weight="650" fill="#1d1d1f">0.07×</text>
  <text x="553.0" y="128.5" font-size="12" font-weight="650" fill="#1d1d1f">1.7×</text>
  <text x="184" y="169" text-anchor="end" font-size="13.5" font-weight="650" fill="#1d1d1f">gpt-oss-120b</text>
  <text x="184" y="185" text-anchor="end" font-size="11.5" fill="#86868b">served at int4</text>
  <line x1="216.0" y1="168" x2="540.0" y2="168" stroke="#d2d2d7" stroke-width="4" stroke-linecap="round"/>
  <circle cx="216.0" cy="168" r="7" fill="#0071e3" stroke="#fff" stroke-width="2"/>
  <circle cx="540.0" cy="168" r="7" fill="#eb6834" stroke="#fff" stroke-width="2"/>
  <text x="216.0" y="191" text-anchor="middle" font-size="12" font-weight="650" fill="#1d1d1f">0.08×</text>
  <text x="553.0" y="172.5" font-size="12" font-weight="650" fill="#1d1d1f">1.7×</text>
  <text x="184" y="213" text-anchor="end" font-size="13.5" font-weight="650" fill="#1d1d1f">Gemma 4 31B</text>
  <text x="184" y="229" text-anchor="end" font-size="11.5" fill="#86868b">served at int4</text>
  <line x1="226.0" y1="212" x2="640.0" y2="212" stroke="#d2d2d7" stroke-width="4" stroke-linecap="round"/>
  <circle cx="226.0" cy="212" r="7" fill="#0071e3" stroke="#fff" stroke-width="2"/>
  <circle cx="640.0" cy="212" r="7" fill="#eb6834" stroke="#fff" stroke-width="2"/>
  <text x="226.0" y="235" text-anchor="middle" font-size="12" font-weight="650" fill="#1d1d1f">0.13×</text>
  <text x="653.0" y="216.5" font-size="12" font-weight="650" fill="#1d1d1f">2.2×</text>
  <text x="184" y="257" text-anchor="end" font-size="13.5" font-weight="650" fill="#1d1d1f">Llama 3.3 70B</text>
  <text x="184" y="273" text-anchor="end" font-size="11.5" fill="#86868b">served at fp8</text>
  <line x1="250.0" y1="256" x2="620.0" y2="256" stroke="#d2d2d7" stroke-width="4" stroke-linecap="round"/>
  <circle cx="250.0" cy="256" r="7" fill="#0071e3" stroke="#fff" stroke-width="2"/>
  <circle cx="620.0" cy="256" r="7" fill="#eb6834" stroke="#fff" stroke-width="2"/>
  <text x="250.0" y="279" text-anchor="middle" font-size="12" font-weight="650" fill="#1d1d1f">0.25×</text>
  <text x="633.0" y="260.5" font-size="12" font-weight="650" fill="#1d1d1f">2.1×</text>
  <text x="184" y="301" text-anchor="end" font-size="13.5" font-weight="650" fill="#1d1d1f">DeepSeek V3.2</text>
  <text x="184" y="317" text-anchor="end" font-size="11.5" fill="#86868b">served at fp8</text>
  <line x1="296.0" y1="300" x2="800.0" y2="300" stroke="#d2d2d7" stroke-width="4" stroke-linecap="round"/>
  <circle cx="296.0" cy="300" r="7" fill="#0071e3" stroke="#fff" stroke-width="2"/>
  <circle cx="800.0" cy="300" r="7" fill="#eb6834" stroke="#fff" stroke-width="2"/>
  <text x="296.0" y="323" text-anchor="middle" font-size="12" font-weight="650" fill="#1d1d1f">0.48×</text>
  <text x="813.0" y="304.5" font-size="12" font-weight="650" fill="#1d1d1f">3.0×</text>
  <circle cx="207" cy="380" r="6" fill="#0071e3"/><text x="220" y="384.5" font-size="12.5" fill="#1d1d1f">Bare compute — the GPU line alone, at full utilisation</text>
  <circle cx="207" cy="402" r="6" fill="#eb6834"/><text x="220" y="406.5" font-size="12.5" fill="#1d1d1f">Fully loaded — the same fleet with idle capacity, people and overhead</text>
</svg>
