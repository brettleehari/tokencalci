<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 470" width="1120" height="470"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
     role="img" aria-labelledby="f2t f2d">
  <title id="f2t">Cost is piecewise constant in resident context</title>
  <desc id="f2d">Self-host cost per million tokens plotted against resident context. The curve is a
  staircase: flat runs where additional context is free, separated by vertical risers where the fleet
  gains a GPU per replica. Two operating points are marked — one mid-step where the elasticity of
  context is zero, one near a riser where it exceeds two.</desc>
  <rect width="1120" height="470" fill="#ffffff"/>

  <text x="92" y="34" font-size="15" font-weight="700" fill="#1d1d1f">Cost is piecewise constant in resident context</text>
  <text x="92" y="54" font-size="12.5" fill="#6e6e73">Llama 3.3 70B at fp8 · 200,000 requests/day · concurrency held at 97 · same model, same hardware throughout</text>

  <!-- grid -->
  <line x1="92" y1="342.1" x2="1064" y2="342.1" stroke="#ededf0"/>
  <text x="82" y="346.1" text-anchor="end" font-size="11" fill="#86868b">$0.40</text>
  <line x1="92" y1="278.1" x2="1064" y2="278.1" stroke="#ededf0"/>
  <text x="82" y="282.1" text-anchor="end" font-size="11" fill="#86868b">$0.50</text>
  <line x1="92" y1="214.1" x2="1064" y2="214.1" stroke="#ededf0"/>
  <text x="82" y="218.1" text-anchor="end" font-size="11" fill="#86868b">$0.60</text>
  <line x1="92" y1="150.0" x2="1064" y2="150.0" stroke="#ededf0"/>
  <text x="82" y="154.0" text-anchor="end" font-size="11" fill="#86868b">$0.70</text>
  <line x1="92" y1="86.0" x2="1064" y2="86.0" stroke="#ededf0"/>
  <text x="82" y="90.0" text-anchor="end" font-size="11" fill="#86868b">$0.80</text>
  <line x1="92" y1="348" x2="1064" y2="348" stroke="#d2d2d7"/>
  <line x1="92" y1="74" x2="92" y2="348" stroke="#d2d2d7"/>
  <text x="299.0" y="368" text-anchor="middle" font-size="11" fill="#86868b">5K</text>
  <text x="524.0" y="368" text-anchor="middle" font-size="11" fill="#86868b">10K</text>
  <text x="749.0" y="368" text-anchor="middle" font-size="11" fill="#86868b">15K</text>
  <text x="974.0" y="368" text-anchor="middle" font-size="11" fill="#86868b">20K</text>
  <text x="578" y="390" text-anchor="middle" font-size="12" fill="#6e6e73">resident context per active request (tokens)</text>
  <text x="26" y="211" font-size="12" fill="#6e6e73" transform="rotate(-90 26 211)" text-anchor="middle">self-host $ per 1M tokens</text>

  <!-- risers, drawn behind the curve -->
  <line x1="276.5" y1="332.0" x2="276.5" y2="272.6" stroke="#ff9f0a" stroke-width="2.5"/>
  <line x1="488.0" y1="272.6" x2="488.0" y2="213.1" stroke="#ff9f0a" stroke-width="2.5"/>
  <line x1="699.5" y1="213.1" x2="699.5" y2="153.6" stroke="#ff9f0a" stroke-width="2.5"/>
  <line x1="911.0" y1="153.6" x2="911.0" y2="94.2" stroke="#ff9f0a" stroke-width="2.5"/>

  <!-- the staircase -->
  <path d="M92.0 332.0 L274.3 332.0 L276.5 272.6 L485.8 272.6 L488.0 213.1 L697.3 213.1 L699.5 153.6 L908.8 153.6 L911.0 94.2 L1064.0 94.2" fill="none" stroke="#0071e3" stroke-width="2.8" stroke-linejoin="round"/>

  <!-- GPU count per run -->
  <text x="183.1" y="321.0" text-anchor="middle" font-size="10.5" fill="#0071e3" font-weight="650">2 GPU</text>
  <text x="381.1" y="261.6" text-anchor="middle" font-size="10.5" fill="#0071e3" font-weight="650">3 GPU</text>
  <text x="592.6" y="202.1" text-anchor="middle" font-size="10.5" fill="#0071e3" font-weight="650">4 GPU</text>
  <text x="804.1" y="142.6" text-anchor="middle" font-size="10.5" fill="#0071e3" font-weight="650">5 GPU</text>
  <text x="987.5" y="83.2" text-anchor="middle" font-size="10.5" fill="#0071e3" font-weight="650">6 GPU</text>

  <!-- "free" annotation on the widest run -->
  <text x="381.1" y="294.6" text-anchor="middle" font-size="11" fill="#34c759" font-weight="650">context is free along here</text>
  <text x="381.1" y="309.6" text-anchor="middle" font-size="10.5" fill="#6e6e73">elasticity 0.00 — the marginal token costs nothing</text>

  <!-- riser callout -->
  <text x="288.5" y="90.0" font-size="11" fill="#c67700" font-weight="650">each riser = +1 GPU per replica</text>
  <text x="288.5" y="105.0" font-size="10.5" fill="#6e6e73">the marginal token costs a whole card</text>

  <!-- operating points -->
  <circle cx="186.5" cy="332.0" r="6" fill="#34c759" stroke="#fff" stroke-width="2"/>
  <circle cx="267.5" cy="332.0" r="6" fill="#ff9f0a" stroke="#fff" stroke-width="2"/>

  <!-- the comparison panel: the finding -->
  <rect x="92" y="382" width="972" height="72" rx="10" fill="#f5f5f7" stroke="#d2d2d7"/>
  <circle cx="116" cy="404" r="5" fill="#34c759"/>
  <text x="130" y="408" font-size="12.5" fill="#1d1d1f"><tspan font-weight="700">Mid-step, 2,500 tokens.</tspan> 58% of the step consumed. Elasticity of context <tspan font-weight="700" fill="#34c759">0.00</tspan> · of volume <tspan font-weight="700" fill="#34c759">-1.00</tspan> (growth dilutes fixed cost)</text>
  <circle cx="116" cy="432" r="5" fill="#ff9f0a"/>
  <text x="130" y="436" font-size="12.5" fill="#1d1d1f"><tspan font-weight="700">Near the riser, 4,300 tokens.</tspan> 96% consumed. Elasticity of context <tspan font-weight="700" fill="#c67700">2.12</tspan> · of volume <tspan font-weight="700" fill="#c67700">+1.12</tspan> — growth now buys hardware</text>
</svg>
